name: Reset Admin Password

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: Existing active administrator email
        required: true
        default: yao990729@gmail.com
        type: string

permissions:
  contents: read

concurrency:
  group: reset-admin-password
  cancel-in-progress: false

jobs:
  reset:
    name: Reset existing administrator password
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
      ADMIN_EMAIL: ${{ inputs.admin_email }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured"
            exit 1
          }
          test -n "${{ secrets.SUPABASE_PROJECT_ID }}" || {
            echo "::error::SUPABASE_PROJECT_ID is not configured"
            exit 1
          }
          test -n "$ADMIN_RESET_PASSWORD" || {
            echo "::error::ADMIN_RESET_PASSWORD is not configured"
            exit 1
          }

      - name: Reset verified administrator password
        shell: bash
        run: |
          pnpm recover:admin -- --admin-email "$ADMIN_EMAIL" >/dev/null
          echo "Existing active administrator password reset completed."
